# Render Blueprint — deploys the NestJS backend as a web service.
# Connect this repo to Render and it will auto-detect this file.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: vape-shop-api
    runtime: node
    region: singapore  # Closest to Philippines
    plan: free         # Change to "starter" ($7/mo) for always-on
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard (Neon connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: CORS_ORIGIN
        sync: false  # Set to your Vercel frontend URL
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: SESSION_TIMEOUT
        value: "900"
      - key: RATE_LIMIT_TTL
        value: "60"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: BODY_LIMIT
        value: "15mb"
